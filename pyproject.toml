[project]
name = "pynamic"
version = "0.1.0"
description = "A possible library for dynamics and dynamic environments in python"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.2.0",
]

[dependency-groups]
dev = [
    "ipython>=8.31.0",
    "mypy>=1.13.0",
    "pre-commit>=4.0.1",
    "pytest>=8.3.4",
    "ruff>=0.8.3",
]

[tool.isort]
force_single_line = true
